services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8053:8053"
    # Cypress/Chrome can exceed Docker's default shared-memory allocation.
    shm_size: 2gb
    # Reaps browser subprocesses launched by Cypress.
    init: true
    restart: unless-stopped
